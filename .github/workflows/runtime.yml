name: Runtime packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Check target architecture
        env:
          RUNTIME_PLATFORM: ${{ matrix.platform }}
        run: node -e "if (process.platform + '-' + process.arch !== process.env.RUNTIME_PLATFORM) process.exit(1)"
      - run: npm test
      - run: npm run build
      - run: python scripts/build-runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/runtime-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x64'
        with:
          name: plugin-xpi
          path: dist/*.xpi
  node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm ci
      - run: npm test
  release:
    needs: [package, node22]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          manifest = {'schema':1,'version':version,'assets':{},'services':{}}
          for path in Path('dist').glob('runtime-*.json'):
              part = json.loads(path.read_text())
              assert part['version'] == version
              for group in ['assets','services']:
                  for key, value in part[group].items():
                      artifact = Path('dist') / value['name']
                      assert artifact.stat().st_size == value['size']
                      assert hashlib.file_digest(artifact.open('rb'),'sha256').hexdigest() == value['sha256']
                      manifest[group][key] = value
          assert len(manifest['assets']) == len(manifest['services']) == 5
          Path('dist/runtime-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: complete-release
          path: |
            dist/*.xpi
            dist/*.zip
            dist/runtime-manifest.json
      - name: Upload draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "docs/release-$VERSION.md"
          fi
          gh release upload "$TAG" dist/*.xpi dist/*.zip dist/runtime-manifest.json --clobber
